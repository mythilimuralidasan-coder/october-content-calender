<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>October Content Calendar — Jomo Home Interiors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF2F8;
    --surface:#FFFFFF;
    --ink:#122540;
    --ink-soft:#5B6E85;
    --line:#D9E2EC;
    --navy:#192B45;
    --gold:#DDA851;
    --gold-dark:#8A6520;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B121C;
      --surface:#15233A;
      --ink:#E9EEF5;
      --ink-soft:#93A5BB;
      --line:#2A3A54;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Quicksand',system-ui,sans-serif;
    padding:32px 20px;
  }
  .wrap{max-width:620px;margin:0 auto;}

  .eyebrow{
    font-family:'League Spartan';
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold-dark);
  }
  @media (prefers-color-scheme: dark){ .eyebrow{color:var(--gold);} }

  .top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .status{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:5px;}

  h1{
    font-family:'League Spartan';
    font-weight:800;
    font-size:clamp(24px,5vw,32px);
    color:var(--navy);
    margin:4px 0 0;
    line-height:1.12;
  }
  @media (prefers-color-scheme: dark){ h1{color:var(--ink);} }

  hr{border:none;border-top:2px solid var(--gold);width:40px;margin:14px 0 26px;}

  [contenteditable="true"]{cursor:text;border-radius:5px;outline:1px dashed transparent;outline-offset:3px;transition:outline-color .12s ease;}
  [contenteditable="true"]:hover{outline-color:var(--gold-dark);}
  [contenteditable="true"]:focus{outline:2px solid var(--gold);outline-offset:3px;background:var(--surface);}

  .list{display:flex;flex-direction:column;}
  .row{
    display:flex;
    align-items:baseline;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .date{flex:none;width:52px;text-align:center;}
  .date .num{
    display:block;
    font-family:'League Spartan';
    font-weight:800;
    font-size:21px;
    color:var(--navy);
    line-height:1;
  }
  @media (prefers-color-scheme: dark){ .date .num{color:var(--ink);} }
  .date .wd{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-dark);
    margin-top:2px;
  }
  @media (prefers-color-scheme: dark){ .date .wd{color:var(--gold);} }
  .heading{flex:1;font-size:15.5px;font-weight:600;line-height:1.4;padding-top:1px;}

  footer{
    margin-top:30px;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap" id="appRoot"></div>

<script id="state-data" type="application/json">{"title":"October Content Calendar","days":[{"d":2,"wd":"Fri","t":"Campaign Launch: Diwali-Ready Homes"},{"d":5,"wd":"Mon","t":"5 Modular Kitchen Layouts That Save Space"},{"d":7,"wd":"Wed","t":"Transformation Wednesday: Living Room Reveal"},{"d":9,"wd":"Fri","t":"Client Love: “It Finally Feels Like Our Home”"},{"d":12,"wd":"Mon","t":"Wardrobe 101: Sliding vs Hinged Doors"},{"d":14,"wd":"Wed","t":"Book Before Navratri, Move In Before Diwali"},{"d":16,"wd":"Fri","t":"Styling Your Home for Golu"},{"d":19,"wd":"Mon","t":"Pooja Unit Design Ideas for Modern Homes"},{"d":21,"wd":"Wed","t":"Free Styling Consultation Before Golu"},{"d":23,"wd":"Fri","t":"Vijayadashami: Victory Over Clutter"},{"d":26,"wd":"Mon","t":"What Chennai Is Saying About Us"},{"d":28,"wd":"Wed","t":"10 Days to Diwali: Final Weekend to Book"},{"d":30,"wd":"Fri","t":"Month Recap: Our Best Transformations"}]}</script>

<script>
(function(){
  var STORAGE_KEY = 'jomo-october-calendar-v1';

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function loadState(){
    try{
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    }catch(e){}
    var el = document.getElementById('state-data');
    try{ return JSON.parse(el.textContent); }catch(e){}
    return {title:'October Content Calendar', days:[]};
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    var dot = document.getElementById('statusDot');
    var text = document.getElementById('statusText');
    if (text && text.lastChild){ text.lastChild.textContent = 'Saved to this browser'; }
    if (dot){ dot.style.background = 'var(--gold)'; setTimeout(function(){ dot.style.background = '#2E9E5B'; if (text && text.lastChild) text.lastChild.textContent = 'Saved to this browser'; }, 300); }
  }

  var state = loadState();

  function rowsHTML(state){
    return state.days.map(function(info){
      return '<div class="row" data-date="'+info.d+'">'
        + '<div class="date"><span class="num">'+info.d+'</span><span class="wd">'+esc(info.wd)+'</span></div>'
        + '<div class="heading" contenteditable="true" data-field="t">'+esc(info.t)+'</div>'
        + '</div>';
    }).join('');
  }

  function render(){
    document.getElementById('appRoot').innerHTML =
        '<div class="top-row">'
      +   '<span class="eyebrow">Instagram · October 2026 · Mon / Wed / Fri</span>'
      +   '<span class="status" id="statusText"><span class="status-dot" id="statusDot" style="background:#2E9E5B"></span>Saved to this browser</span>'
      + '</div>'
      + '<h1 contenteditable="true" data-field="title">'+esc(state.title)+'</h1>'
      + '<hr>'
      + '<div class="list" id="list">'+rowsHTML(state)+'</div>'
      + '<footer>Edits here save to this browser only (no server). To share edits across people or devices, this calendar needs a small backend — ask Claude to wire one up.</footer>';
  }

  render();

  document.getElementById('appRoot').addEventListener('focusout', function(e){
    var t = e.target;
    if (!t.matches || !t.matches('[contenteditable="true"][data-field]')) return;
    var field = t.dataset.field;
    var value = t.textContent.replace(/\s+/g,' ').trim();
    var row = t.closest('.row');
    if (row){
      var date = parseInt(row.getAttribute('data-date'), 10);
      var day = state.days.filter(function(x){ return x.d === date; })[0];
      if (day) day[field] = value;
    } else {
      state[field] = value;
    }
    saveState();
  });
})();
</script>
</body>
</html>
